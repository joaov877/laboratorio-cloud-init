#cloud-config

# Atualiza o indice de pacotes
package_update: true

# Instala o Docker oficial do repositorio Ubuntu
packages:
  - docker.io

runcmd:
  # Habilita no boot e inicia o Docker 
  - systemctl enable --now docker
  # Sobe o container em modo detached: porta 8080 do host -> porta 80 do container
  - docker run -d --name hello --restart unless-stopped -p 8080:80 nginxdemos/hello