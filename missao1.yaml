#cloud-config


package_update: true

)
package_upgrade: true

# Instalação do servidor web Nginx
packages:
  - nginx

# Criação da página inicial HTML
write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="pt-BR">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Laboratório Cloud-init</title>
      </head>
      <body>
        <h1>Servidor configurado com sucesso!</h1>
        <p>Esta página foi criada automaticamente pelo Cloud-init.</p>
        <p>Missão 1 - Multipass e Nginx.</p>
      </body>
      </html>

# Reinicia o Nginx depois da criação da página
runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
